<ion-header>
  <ion-toolbar>
    <ion-title> {{ isEdit() ? 'Actualizar tarea' : 'Nueva tarea'}} </ion-title>

    <ion-buttons slot="end">
      <ion-button (click)="closeModal()"> Cerrar </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form" (ngSubmit)="saveForm()" class="task-form">
  <ion-input
    fill="solid"
    formControlName="title"
    label="Título"
    labelPlacement="stacked"
    placeholder="Escribe el título de la tarea"
  >
  </ion-input>

  <ion-input
    fill="solid"
    formControlName="description"
    label="Descripción"
    labelPlacement="stacked"
    placeholder="Escribe la descripción de la tarea"
  >
  </ion-input>

  <ion-select
    fill="solid"
    formControlName="categoryId"
    label-placement="stacked"
    interface="popover"
    placeholder="Selecciona una categoría"
  >
    <ion-select-option value="">Sin categoría</ion-select-option>
    @for(category of categories(); track category.id) {
      <ion-select-option [value]="category.id">
        {{ category.name }}  
      </ion-select-option>
    }
  </ion-select>

  <ion-button expand="block" (click)="saveForm()"> Guardar </ion-button>
  </form>
</ion-content>
