<ion-item [class.completed]="task().completed === true">
  @if (task().categoryColor) {
    <div
      slot="start"
      class="task-item-indicator"
      [style.background]="task().categoryColor"
    ></div>
  }

  <ion-checkbox
    [checked]="task().completed === true"
    (ionChange)="toggle.emit(task())"
    slot="start"
  ></ion-checkbox>

  <ion-label>
    <h2>{{ task().title }}</h2>
    @if (task().description) {
      <ion-note>{{ task().description }}</ion-note>
    }
  </ion-label>

  <ion-button fill="clear" (click)="edit.emit(task())" slot="end">
    <ion-icon name="create-outline"></ion-icon>
  </ion-button>
  <ion-button fill="clear" (click)="delete.emit(task())" slot="end">
    <ion-icon name="trash-outline"></ion-icon>
  </ion-button>
</ion-item>
