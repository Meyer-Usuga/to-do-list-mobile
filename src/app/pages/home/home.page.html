<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      To-do list
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">To-do list</ion-title>
    </ion-toolbar>
  </ion-header>

  <div id="container">
    <app-task-list [tasks]="tasks()"/>
  </div>
</ion-content>
